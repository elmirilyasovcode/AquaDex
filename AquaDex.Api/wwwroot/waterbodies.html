<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaDex — Waterbodies</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .wb-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 8px;
        }

        .wb-filter-row {
            display: flex;
            gap: 8px;
            margin: 20px 0 24px;
            flex-wrap: wrap;
        }

        .region-chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: border-color 0.15s, color 0.15s;
        }

            .region-chip.active, .region-chip:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

        .wb-card {
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

            .wb-card:hover {
                transform: translateY(-4px);
                border-color: var(--accent);
                box-shadow: 0 10px 28px rgba(0,0,0,0.2);
            }

        .wb-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .wb-type-icon {
            font-size: 1.4rem;
        }

        .wb-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.05rem;
        }

        .wb-region {
            font-size: 0.76rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
        }

        .wb-species-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.87rem;
        }

            .wb-species-row:last-child {
                border-bottom: none;
            }

        .abundance-bar {
            display: flex;
            gap: 3px;
        }

            .abundance-bar span {
                width: 14px;
                height: 5px;
                border-radius: 3px;
                background: var(--border);
                transition: background 0.2s;
            }

                .abundance-bar span.filled {
                    background: var(--accent);
                }

        .wb-species-count-badge {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            padding: 3px 9px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header id="site-header"></header>
    <div class="page-wrap">
        <div class="wb-hero">
            <div>
                <h1>Waterbodies</h1>
                <p class="subtitle" style="margin-bottom: 0;">Known fishing locations across Azerbaijan</p>
            </div>
        </div>

        <div class="wb-filter-row" id="region-filters"></div>

        <div id="msg-container"></div>
        <div id="waterbody-grid" class="card-grid">
            <div class="card"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div><div class="skeleton-line w-80"></div></div>
            <div class="card"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div><div class="skeleton-line w-80"></div></div>
            <div class="card"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div><div class="skeleton-line w-80"></div></div>
        </div>

        <div id="add-waterbody-section" style="display:none; margin-top: 32px; max-width: 480px;">
            <div class="card">
                <h2 style="font-size: 1rem; margin-bottom: 14px;">Add Waterbody</h2>
                <div id="wb-msg"></div>
                <form id="wb-form">
                    <div class="field-group"><label for="wbName">Name</label><input type="text" id="wbName" required></div>
                    <div class="field-group">
                        <label for="wbType">Type</label>
                        <select id="wbType"><option value="0">Sea</option><option value="1">River</option><option value="2">Reservoir</option><option value="3">Farm</option></select>
                    </div>
                    <div class="field-group"><label for="wbRegion">Region</label><input type="text" id="wbRegion" required></div>
                    <button type="submit" id="wb-submit-btn" class="btn">Add Waterbody</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shared-header.js"></script>
    <script>
        renderHeader('waterbodies.html');

        const TYPE_ICONS = { 0: '🌊', 1: '🏞️', 2: '🪣', 3: '🐟' };
        let allWaterbodies = [];
        let currentRegionFilter = 'all';

        function abundanceBar(rating) {
            let bars = '';
            for (let i = 1; i <= 5; i++) bars += `<span class="${i <= rating ? 'filled' : ''}"></span>`;
            return `<div class="abundance-bar">${bars}</div>`;
        }

        function renderRegionFilters(waterbodies) {
            const regions = [...new Set(waterbodies.map(w => w.region))];
            const filterEl = document.getElementById('region-filters');
            filterEl.innerHTML = `<button class="region-chip active" data-region="all">All Regions</button>` +
                regions.map(r => `<button class="region-chip" data-region="${r}">${r}</button>`).join('');

            filterEl.querySelectorAll('.region-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    filterEl.querySelectorAll('.region-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    currentRegionFilter = chip.dataset.region;
                    renderCards();
                });
            });
        }

        async function renderCards() {
            const grid = document.getElementById('waterbody-grid');
            const filtered = currentRegionFilter === 'all'
                ? allWaterbodies
                : allWaterbodies.filter(w => w.region === currentRegionFilter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state-rich card" style="grid-column: 1 / -1;"><div class="icon">🗺️</div><div class="title">No waterbodies here</div><div class="sub">Try a different region filter.</div></div>`;
                return;
            }

            const cards = await Promise.all(filtered.map(async (wb, i) => {
                let speciesLinks = [];
                try { speciesLinks = await apiRequest(`/specieswaterbody/by-waterbody/${wb.id}`); } catch { }

                const speciesHtml = speciesLinks.length > 0
                    ? speciesLinks.map(link => `
                  <div class="wb-species-row">
                    <span>${link.speciesCommonNameEn}</span>
                    ${abundanceBar(link.abundanceRating)}
                  </div>
                `).join('')
                    : `<p style="color: var(--text-secondary); font-size: 0.82rem; padding: 8px 0;">No species data recorded yet.</p>`;

                return `
              <div class="card wb-card" data-animate style="animation-delay: ${Math.min(i * 0.06, 0.4)}s;">
                <div class="wb-card-head">
                  <div class="wb-type-icon">${TYPE_ICONS[wb.type] ?? '🌊'}</div>
                  <span class="wb-species-count-badge">${speciesLinks.length} species</span>
                </div>
                <div class="wb-name">${wb.name}</div>
                <div class="wb-region">${wb.region}</div>
                ${speciesHtml}
              </div>
            `;
            }));

            grid.innerHTML = cards.join('');
        }

        (async () => {
            const msgContainer = document.getElementById('msg-container');
            try {
                allWaterbodies = await apiRequest('/waterbody');

                if (allWaterbodies.length === 0) {
                    document.getElementById('waterbody-grid').innerHTML = `
                <div class="empty-state-rich card" style="grid-column: 1 / -1;">
                  <div class="icon">🗺️</div>
                  <div class="title">No waterbodies recorded yet</div>
                  <div class="sub">Verified Experts can add the first location.</div>
                </div>`;
                } else {
                    renderRegionFilters(allWaterbodies);
                    await renderCards();
                }
            } catch (err) {
                msgContainer.innerHTML = `<div class="msg-box msg-error">Failed to load waterbodies: ${err.message}</div>`;
            }

            try {
                const user = await apiRequest('/auth/me');
                if (user.roles.includes('VerifiedExpert') || user.roles.includes('Admin')) {
                    document.getElementById('add-waterbody-section').style.display = 'block';
                }
            } catch { }
        })();

        document.getElementById('wb-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('wb-msg');
            const submitBtn = document.getElementById('wb-submit-btn');
            submitBtn.classList.add('is-loading');
            try {
                await apiRequest('/waterbody', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('wbName').value,
                        type: parseInt(document.getElementById('wbType').value),
                        region: document.getElementById('wbRegion').value
                    })
                });
                msg.innerHTML = `<div class="msg-box msg-success">Waterbody added.</div>`;
                document.getElementById('wb-form').reset();
                setTimeout(() => location.reload(), 800);
            } catch (err) {
                submitBtn.classList.remove('is-loading');
                msg.innerHTML = `<div class="msg-box msg-error">${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
