<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaDex — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="container">
        <h1>AquaDex</h1>
        <p class="subtitle">Fisheries Access Terminal</p>

        <div class="hud-panel">
            <h2 style="font-size: 1.1rem; margin-bottom: 20px;">Sign In</h2>

            <div id="msg-container"></div>

            <form id="login-form">
                <div class="field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Authenticate</button>
            </form>

            <p style="margin-top: 20px; font-size: 0.85rem; color: var(--text-dim);">
                No access credentials? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    const form = document.getElementById('login-form');
    const msgContainer = document.getElementById('msg-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgContainer.innerHTML = '';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const result = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        msgContainer.innerHTML = `<div class="msg-box msg-success">Welcome back, ${result.displayName}.</div>`;
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } catch (err) {
        msgContainer.innerHTML = `<div class="msg-box msg-error">${err.message}</div>`;
      }
    });
    </script>
</body>
</html>
