<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaDex — Catch Log</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .catches-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        #log-form-panel {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.35s ease;
            margin-bottom: 0;
        }

            #log-form-panel.open {
                max-height: 900px;
                opacity: 1;
                margin-bottom: 28px;
            }

        .feed-item {
            opacity: 0;
            animation: feedIn 0.4s ease forwards;
            transition: transform 0.18s ease, border-color 0.18s ease;
        }

        @keyframes feedIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feed-item:hover {
            transform: translateX(3px);
            border-color: var(--accent);
        }

        .feed-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .feed-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .feed-main {
            flex: 1;
        }

        .feed-species {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .feed-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 3px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .feed-notes {
            margin-top: 8px;
            font-size: 0.88rem;
            color: var(--text-primary);
        }

        .protected-flag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--warning);
            background: rgba(240, 168, 96, 0.12);
            padding: 3px 10px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .location-tag {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

            .location-tag.hidden-loc {
                color: var(--text-secondary);
                font-style: italic;
            }

        .feed-photo {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <header id="site-header"></header>
    <div class="page-wrap">

        <div class="catches-hero">
            <div>
                <h1>Catch Log</h1>
                <p class="subtitle" style="margin-bottom: 0;">Public field feed</p>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="/api/v1/catchlog/export/csv" class="btn secondary">Export CSV</a>
                <a href="/api/v1/catchlog/export/pdf" class="btn secondary">Export PDF</a>
                <button id="toggle-form-btn" class="btn">+ Log a Catch</button>
            </div>
        </div>

        <div id="log-form-panel" class="card" style="max-width: 560px;">
            <h2 style="font-size: 1.05rem; margin-bottom: 18px;">New Catch Entry</h2>
            <div id="form-msg"></div>
            <form id="catch-form">
                <div class="field-group">
                    <label for="speciesSelect">Species</label>
                    <select id="speciesSelect" required></select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="field-group"><label for="weightKg">Weight (kg)</label><input type="number" step="0.1" id="weightKg"></div>
                    <div class="field-group"><label for="lengthCm">Length (cm)</label><input type="number" step="0.1" id="lengthCm"></div>
                    <div class="field-group"><label for="latitude">Latitude</label><input type="number" step="0.0001" id="latitude" required></div>
                    <div class="field-group"><label for="longitude">Longitude</label><input type="number" step="0.0001" id="longitude" required></div>
                </div>
                <div class="field-group"><label for="caughtAt">Date Caught</label><input type="datetime-local" id="caughtAt" required></div>
                <div class="field-group"><label for="notes">Notes</label><textarea id="notes" rows="3"></textarea></div>
                <div class="checkbox-row">
                    <input type="checkbox" id="shareExactLocation">
                    <label for="shareExactLocation">Share exact location publicly</label>
                </div>

                <div class="field-group">
                    <label for="photoFile">Photo (optional)</label>
                    <input type="file" id="photoFile" accept=".jpg,.jpeg,.png,.webp">
                    <div id="photo-preview" style="margin-top: 8px;"></div>
                </div>
                <button type="submit" class="btn">Submit Catch</button>
            </form>
        </div>

        <div id="feed-msg"></div>
        <div id="feed-list"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shared-header.js"></script>
    <script>
        renderHeader('catches.html');

        const toggleBtn = document.getElementById('toggle-form-btn');
        const formPanel = document.getElementById('log-form-panel');

        toggleBtn.addEventListener('click', async () => {
            const isOpening = !formPanel.classList.contains('open');
            formPanel.classList.toggle('open');
            toggleBtn.textContent = isOpening ? '– Close Form' : '+ Log a Catch';
            if (isOpening) {
                try { await apiRequest('/auth/me'); }
                catch { formPanel.innerHTML = `<div class="msg-box msg-error">You must be logged in to log a catch. <a href="login.html">Sign in</a></div>`; }
            }
        });

        async function loadSpeciesDropdown() {
            const select = document.getElementById('speciesSelect');
            const species = await apiRequest('/species');
            select.innerHTML = species.map(s => `<option value="${s.id}">${s.commonNameEn}</option>`).join('');
        }

        function formatCoords(lat, lon) {
            if (lat === null || lon === null) return `<span class="location-tag hidden-loc">🔒 Location hidden</span>`;
            return `<span class="location-tag">📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}</span>`;
        }

        async function loadFeed() {
            const feedList = document.getElementById('feed-list');
            const feedMsg = document.getElementById('feed-msg');
            try {
                const logs = await apiRequest('/catchlog');
                if (logs.length === 0) {
                    feedList.innerHTML = `<div class="card" style="color: var(--text-secondary); font-size: 0.88rem;">No catches logged yet. Be the first.</div>`;
                    return;
                }
                feedList.innerHTML = logs.map((log, i) => `
                  <div class="card feed-item" style="margin-bottom: 8px; animation-delay: ${Math.min(i * 0.05, 0.5)}s;">
                    <div class="feed-row">
                      <div class="feed-icon">🐟</div>
                      <div class="feed-main">
                        <div class="feed-species">${log.speciesCommonNameEn}</div>
                        <div class="feed-meta">
                          <span>${log.userDisplayName}</span>
                          ${log.weightKg ? `<span>${log.weightKg} kg</span>` : ''}
                          ${log.lengthCm ? `<span>${log.lengthCm} cm</span>` : ''}
                          ${formatCoords(log.latitude, log.longitude)}
                          <span>${new Date(log.caughtAt).toLocaleDateString('en-GB')}</span>
                        </div>
                        ${log.notes ? `<div class="feed-notes">${log.notes}</div>` : ''}
                        ${log.photoUrl ? `<img src="${log.photoUrl}" class="feed-photo">` : ''}
                        ${log.isProtectedSpeciesCatch ? `<span class="protected-flag">⚠ Protected Species</span>` : ''}
                      </div>
                    </div>
                  </div>
                `).join('');
            } catch (err) {
                feedMsg.innerHTML = `<div class="msg-box msg-error">Failed to load feed: ${err.message}</div>`;
            }
        }

        document.getElementById('photoFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('photo-preview');
            if (file) {
                preview.innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width: 160px; border-radius: 8px; border: 1px solid var(--border);">`;
            } else {
                preview.innerHTML = '';
            }
        });

        document.getElementById('catch-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formMsg = document.getElementById('form-msg');
            formMsg.innerHTML = '';

            let photoUrl = null;
            const photoFile = document.getElementById('photoFile').files[0];

            if (photoFile) {
                try {
                    formMsg.innerHTML = `<div class="msg-box msg-success">Uploading photo...</div>`;
                    const uploadResult = await uploadFile(photoFile);
                    photoUrl = uploadResult.url;
                } catch (err) {
                    formMsg.innerHTML = `<div class="msg-box msg-error">Photo upload failed: ${err.message}</div>`;
                    return;
                }
            }

            const payload = {
                speciesId: parseInt(document.getElementById('speciesSelect').value),
                weightKg: document.getElementById('weightKg').value ? parseFloat(document.getElementById('weightKg').value) : null,
                lengthCm: document.getElementById('lengthCm').value ? parseFloat(document.getElementById('lengthCm').value) : null,
                photoUrl: photoUrl,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                shareExactLocation: document.getElementById('shareExactLocation').checked,
                caughtAt: new Date(document.getElementById('caughtAt').value).toISOString(),
                notes: document.getElementById('notes').value || null
            };

            try {
                await apiRequest('/catchlog', { method: 'POST', body: JSON.stringify(payload) });
                formMsg.innerHTML = `<div class="msg-box msg-success">Catch logged successfully.</div>`;
                document.getElementById('catch-form').reset();
                document.getElementById('photo-preview').innerHTML = '';
                await loadFeed();
            } catch (err) {
                formMsg.innerHTML = `<div class="msg-box msg-error">${err.message}</div>`;
            }
        });

        (async () => { await loadSpeciesDropdown(); await loadFeed(); })();
    </script>
</body>
</html>
