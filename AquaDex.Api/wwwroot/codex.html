<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaDex — Species Codex</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .codex-hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .codex-title-block h1 {
            margin-bottom: 4px;
        }

        .progress-badge {
            transition: box-shadow 0.3s ease;
        }

            .progress-badge.complete {
                box-shadow: 0 0 24px rgba(79, 209, 197, 0.25);
                border-color: var(--accent);
            }

        #progress-arc {
            transition: stroke-dashoffset 1.1s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .codex-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

            .codex-toolbar input {
                max-width: 280px;
            }

        .filter-chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 9px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            white-space: nowrap;
        }

            .filter-chip.active, .filter-chip:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

        .codex-tile {
            opacity: 0;
            animation: tileIn 0.45s ease forwards;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        @keyframes tileIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .codex-tile.discovered:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 28px rgba(79, 209, 197, 0.12);
        }

        .codex-tile.undiscovered {
            background: var(--bg-elevated);
        }

            .codex-tile.undiscovered::before {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 60%;
                height: 100%;
                background: linear-gradient(100deg, transparent, rgba(79, 209, 197, 0.07), transparent);
                animation: shimmer 3.2s ease-in-out infinite;
            }

        @keyframes shimmer {
            0% {
                left: -60%;
            }

            100% {
                left: 120%;
            }
        }

        .tile-icon {
            font-size: 1.9rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .tile-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            position: relative;
            z-index: 1;
        }

        .tile-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 3px;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .codex-tile.undiscovered .tile-icon {
            filter: grayscale(1);
            opacity: 0.35;
        }

        .codex-tile.undiscovered .tile-name {
            color: var(--text-secondary);
        }

        .protected-mark {
            display: inline-block;
            font-size: 0.68rem;
            color: var(--warning);
            background: rgba(240, 168, 96, 0.12);
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <header id="site-header"></header>
    <div class="page-wrap">

        <div class="codex-hero">
            <div class="codex-title-block">
                <h1>Species Codex</h1>
                <p class="subtitle" style="margin-bottom: 0;">Databank scan progress</p>
            </div>

            <div class="progress-badge card" id="progress-badge">
                <svg width="64" height="64" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="27" fill="none" stroke="#1f4548" stroke-width="6" />
                    <circle id="progress-arc" cx="32" cy="32" r="27" fill="none" stroke="#4fd1c5" stroke-width="6"
                            stroke-dasharray="169.6" stroke-dashoffset="169.6" stroke-linecap="round"
                            transform="rotate(-90 32 32)" />
                </svg>
                <div>
                    <div class="progress-num" id="progress-percent">0%</div>
                    <div class="progress-label" id="progress-detail">0 / 0 scanned</div>
                </div>
            </div>
        </div>

        <div class="codex-toolbar">
            <input type="text" id="search-input" placeholder="Search species...">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="discovered">Discovered</button>
            <button class="filter-chip" data-filter="undiscovered">Undiscovered</button>
        </div>

        <div id="msg-container"></div>
        <div id="codex-grid" class="card-grid"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shared-header.js"></script>
    <script>
        renderHeader('codex.html');

        let allSpecies = [];
        let discoveredSet = new Set();
        let currentFilter = 'all';

        function renderGrid(searchTerm = '') {
            const grid = document.getElementById('codex-grid');
            const term = searchTerm.toLowerCase();

            const filtered = allSpecies.filter(s => {
                const isDiscovered = discoveredSet.has(s.id);
                if (currentFilter === 'discovered' && !isDiscovered) return false;
                if (currentFilter === 'undiscovered' && isDiscovered) return false;
                if (term && isDiscovered && !s.commonNameEn.toLowerCase().includes(term)) return false;
                if (term && !isDiscovered) return false; // can't search for what you haven't found
                return true;
            });

            grid.innerHTML = filtered.map((species, i) => {
                const isDiscovered = discoveredSet.has(species.id);
                const isProtected = species.conservationStatus >= 2; // Vulnerable or worse
                return `
              <div class="card codex-tile ${isDiscovered ? 'discovered' : 'undiscovered'}" style="animation-delay: ${Math.min(i * 0.04, 0.6)}s;">
                <div class="tile-icon">${isDiscovered ? '🐟' : '❓'}</div>
                <div class="tile-name">${isDiscovered ? species.commonNameEn : '???'}</div>
                ${isDiscovered ? `<div class="tile-sub">${species.latinName}</div>` : `<div class="tile-sub">Unscanned specimen</div>`}
                ${isDiscovered && isProtected ? `<span class="protected-mark">Protected</span>` : ''}
              </div>
            `;
            }).join('');
        }

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                renderGrid(document.getElementById('search-input').value);
            });
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderGrid(e.target.value);
        });

        (async () => {
            const msgContainer = document.getElementById('msg-container');
            try {
                allSpecies = await apiRequest('/species');

                let discoveredIds = [];
                try { discoveredIds = await apiRequest('/catchlog/my-discovered-species'); } catch { }
                discoveredSet = new Set(discoveredIds);

                renderGrid();

                const percent = allSpecies.length > 0 ? Math.round((discoveredSet.size / allSpecies.length) * 100) : 0;
                document.getElementById('progress-percent').textContent = `${percent}%`;
                document.getElementById('progress-detail').textContent = `${discoveredSet.size} / ${allSpecies.length} scanned`;

                if (percent >= 100 && allSpecies.length > 0) {
                    document.getElementById('progress-badge').classList.add('complete');
                }

                // Animate the ring filling in after a short delay so the page has settled first
                setTimeout(() => {
                    const circumference = 169.6;
                    const offset = circumference - (percent / 100) * circumference;
                    document.getElementById('progress-arc').style.strokeDashoffset = offset;
                }, 200);

            } catch (err) {
                msgContainer.innerHTML = `<div class="msg-box msg-error">Failed to load Codex: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>
