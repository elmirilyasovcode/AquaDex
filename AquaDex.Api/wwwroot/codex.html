<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaDex — Species Codex</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header id="site-header"></header>

    <div class="page-wrap">
        <h1>Species Codex</h1>
        <p class="subtitle">Databank Scan Progress</p>

        <div class="codex-progress-ring-wrap">
            <svg id="progress-ring" width="90" height="90" viewBox="0 0 90 90">
                <circle cx="45" cy="45" r="38" fill="none" stroke="#1c4a47" stroke-width="6" />
                <circle id="progress-arc" cx="45" cy="45" r="38" fill="none" stroke="#4fd1c5" stroke-width="6"
                        stroke-dasharray="238.76" stroke-dashoffset="238.76" stroke-linecap="round"
                        transform="rotate(-90 45 45)" />
            </svg>
            <div class="codex-progress-text">
                <div><span class="big-num" id="progress-percent">0%</span></div>
                <div id="progress-detail" style="color: var(--text-dim); font-size: 0.85rem;">0 / 0 species scanned</div>
            </div>
        </div>

        <div id="msg-container"></div>
        <div id="codex-grid" class="codex-grid"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shared-header.js"></script>
    <script>
        renderHeader('codex.html');

        (async () => {
            const grid = document.getElementById('codex-grid');
            const msgContainer = document.getElementById('msg-container');

            try {
                const allSpecies = await apiRequest('/species');

                let discoveredIds = [];
                try {
                    discoveredIds = await apiRequest('/catchlog/my-discovered-species');
                } catch {
                    // Not logged in — everything shows as undiscovered, which is correct behavior
                }

                const discoveredSet = new Set(discoveredIds);

                grid.innerHTML = allSpecies.map(species => {
                    const isDiscovered = discoveredSet.has(species.id);
                    return `
                <div class="codex-tile ${isDiscovered ? 'discovered' : 'undiscovered'}" data-id="${species.id}">
                  <div class="codex-tile-icon">${isDiscovered ? '🐟' : '❓'}</div>
                  <div class="codex-tile-name">${isDiscovered ? species.commonNameEn : '???'}</div>
                </div>
              `;
                }).join('');

                const percent = allSpecies.length > 0
                    ? Math.round((discoveredSet.size / allSpecies.length) * 100)
                    : 0;

                document.getElementById('progress-percent').textContent = `${percent}%`;
                document.getElementById('progress-detail').textContent = `${discoveredSet.size} / ${allSpecies.length} species scanned`;

                const circumference = 238.76;
                const offset = circumference - (percent / 100) * circumference;
                document.getElementById('progress-arc').style.strokeDashoffset = offset;

            } catch (err) {
                msgContainer.innerHTML = `<div class="msg-box msg-error">Failed to load Codex: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>
