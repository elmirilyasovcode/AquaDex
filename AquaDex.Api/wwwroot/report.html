<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaDex — Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header id="site-header"></header>
    <div class="page-wrap">
        <h1>Report</h1>
        <p class="subtitle">Flag a violation or share a live bite alert</p>

        <div style="display: flex; gap: 12px; margin-bottom: 24px;">
            <button class="btn" id="tab-violation">Violation Report</button>
            <button class="btn secondary" id="tab-bite">Bite Alert</button>
        </div>

        <div id="violation-panel" class="card">
            <h2 style="font-size: 1rem; margin-bottom: 16px;">Report a Violation</h2>
            <div id="violation-msg"></div>
            <form id="violation-form">
                <div class="field-group">
                    <label for="violationType">Type</label>
                    <select id="violationType">
                        <option value="0">Poaching</option>
                        <option value="1">Protected Species Catch</option>
                        <option value="2">Pollution</option>
                        <option value="3">Illegal Gear</option>
                        <option value="4">Other</option>
                    </select>
                </div>
                <div class="field-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" required></textarea>
                </div>
                <div class="field-group">
                    <label for="vLat">Latitude</label>
                    <input type="number" step="0.0001" id="vLat" required>
                </div>
                <div class="field-group">
                    <label for="vLon">Longitude</label>
                    <input type="number" step="0.0001" id="vLon" required>
                </div>
                <button type="submit" class="btn">Submit Report</button>
            </form>
        </div>

        <div id="bite-panel" class="card" style="display: none;">
            <h2 style="font-size: 1rem; margin-bottom: 16px;">Post a Bite Alert</h2>
            <div id="bite-msg"></div>
            <form id="bite-form">
                <div class="field-group">
                    <label for="biteSpecies">Species (optional)</label>
                    <select id="biteSpecies"><option value="">— Unknown —</option></select>
                </div>
                <div class="field-group">
                    <label for="biteLat">Latitude</label>
                    <input type="number" step="0.0001" id="biteLat" required>
                </div>
                <div class="field-group">
                    <label for="biteLon">Longitude</label>
                    <input type="number" step="0.0001" id="biteLon" required>
                </div>
                <div class="field-group">
                    <label for="biteMsg">Message</label>
                    <input type="text" id="biteMsg" placeholder="e.g. Catfish biting like crazy right now">
                </div>
                <button type="submit" class="btn">Post Alert</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shared-header.js"></script>
    <script>
  renderHeader('report.html');

  document.getElementById('tab-violation').addEventListener('click', () => {
    document.getElementById('violation-panel').style.display = 'block';
    document.getElementById('bite-panel').style.display = 'none';
  });
  document.getElementById('tab-bite').addEventListener('click', () => {
    document.getElementById('violation-panel').style.display = 'none';
    document.getElementById('bite-panel').style.display = 'block';
  });

  (async () => {
    try {
      const species = await apiRequest('/species');
      const select = document.getElementById('biteSpecies');
      species.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.commonNameEn;
        select.appendChild(opt);
      });
    } catch {}
  })();

  document.getElementById('violation-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('violation-msg');
    try {
      await apiRequest('/ruleviolationreport', {
        method: 'POST',
        body: JSON.stringify({
          violationType: parseInt(document.getElementById('violationType').value),
          description: document.getElementById('description').value,
          latitude: parseFloat(document.getElementById('vLat').value),
          longitude: parseFloat(document.getElementById('vLon').value),
          waterbodyId: null
        })
      });
      msg.innerHTML = `<div class="msg-box msg-success">Report submitted. Thank you for helping protect local fisheries.</div>`;
      document.getElementById('violation-form').reset();
    } catch (err) {
      msg.innerHTML = `<div class="msg-box msg-error">${err.message}</div>`;
    }
  });

  document.getElementById('bite-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('bite-msg');
    const speciesVal = document.getElementById('biteSpecies').value;
    try {
      await apiRequest('/bitealert', {
        method: 'POST',
        body: JSON.stringify({
          latitude: parseFloat(document.getElementById('biteLat').value),
          longitude: parseFloat(document.getElementById('biteLon').value),
          speciesId: speciesVal ? parseInt(speciesVal) : null,
          message: document.getElementById('biteMsg').value || null
        })
      });
      msg.innerHTML = `<div class="msg-box msg-success">Bite alert posted — active for 3 hours.</div>`;
      document.getElementById('bite-form').reset();
    } catch (err) {
      msg.innerHTML = `<div class="msg-box msg-error">${err.message}</div>`;
    }
  });
    </script>
</body>
</html>
