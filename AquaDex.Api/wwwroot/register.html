<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaDex — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="container">
        <h1>AquaDex</h1>
        <p class="subtitle">New Angler Registration</p>

        <div class="hud-panel">
            <h2 style="font-size: 1.1rem; margin-bottom: 20px;">Create Account</h2>

            <div id="msg-container"></div>

            <form id="register-form">
                <div class="field-group">
                    <label for="displayName">Display Name</label>
                    <input type="text" id="displayName" required>
                </div>
                <div class="field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>

            <p style="margin-top: 20px; font-size: 0.85rem; color: var(--text-dim);">
                Already registered? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    const form = document.getElementById('register-form');
    const msgContainer = document.getElementById('msg-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgContainer.innerHTML = '';

      const displayName = document.getElementById('displayName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const result = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ displayName, email, password })
        });

        msgContainer.innerHTML = `<div class="msg-box msg-success">Account created. Welcome, ${result.displayName}.</div>`;
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } catch (err) {
        msgContainer.innerHTML = `<div class="msg-box msg-error">${err.message}</div>`;
      }
    });
    </script>
</body>
</html>
